name: Nightly TripADeal refresh
# Runs once a day. GitHub's scheduled runs are best-effort and often fire an hour or more late,
# so we don't try to pin an exact local time — a single daily cron plus a small random delay to
# spread load is enough. Sunday's run re-parses every deal page; other nights read the listing
# pages and full-parse only deals that are new. Run it on demand from the Actions tab too.
on:
  schedule:
    - cron: "15 14 * * *"   # ~00:15–01:15 Sydney depending on DST (+ GitHub's own delay)
  workflow_dispatch:
    inputs:
      full:
        description: "Re-parse every deal page (weekly-style run)"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    concurrency: { group: tripadeal-refresh, cancel-in-progress: false }
    steps:
      - name: Random delay to spread load (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          S=$(( RANDOM % 5400 ))   # 0–90 minutes
          echo "Sleeping $((S/60)) minutes before scraping"; sleep $S

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: pip install -r requirements.txt

      - name: Scrape
        run: |
          DOW=$(TZ=Australia/Sydney date +%u)   # 7 = Sunday
          FULL=""
          if [ "$DOW" = "7" ] || [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          echo "mode: --prices $FULL"
          python3 scripts/scrape_tripadeal.py --prices $FULL
          python3 scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "tour-globe-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/tours.json data/changelog.json index.html
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          N=$(python3 -c "import json;print(len(json.load(open('data/tours.json'))))")
          E=$(python3 -c "import json;print(len(json.load(open('data/changelog.json'))[-1]['events']))")
          git commit -m "Nightly refresh: $N tours, $E changes ($(TZ=Australia/Sydney date '+%d %b %Y %H:%M') Sydney)"
          git push
