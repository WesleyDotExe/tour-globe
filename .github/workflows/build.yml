name: Build index.html
on:
  push:
    paths: ["scripts/**", "data/**"]
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    if: github.actor != 'tour-globe-bot'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_data.py && python3 scripts/build.py
      - name: Commit rebuilt index.html
        run: |
          git config user.name "tour-globe-bot"; git config user.email "bot@users.noreply.github.com"
          git add index.html data/tours.json data/countries_pts.json
          git diff --cached --quiet || (git commit -m "Rebuild index.html" && git push)
